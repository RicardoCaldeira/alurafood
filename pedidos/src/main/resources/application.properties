spring.datasource.url=jdbc:mysql://localhost:3306/alurafood-pedidos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.application.name=pedidos-ms
eureka.client.serviceUrl.defaultZone=http://localhost:8081/eureka
# propriedade para gerar um id único para cada instância do serviço.
# Com isso, conseguimos subir várias instâncias do mesmo serviço e o Eureka consegue diferenciar cada uma delas.
# Para isso, usamos a propriedade random.int, que gera um número aleatório para cada instância do serviço.
# Para subir outras instâncias do serviço, basta executar o comando `& "c:\alura-food\pedidos\mvnw.cmd" spring-boot:run -f "c:\alura-food\pedidos\pom.xml"` em outro terminal
# O balanceamento de carga do Eureka vai distribuir as requisições entre as instâncias do serviço automaticamente, basta chamar o serviço pelo nome do serviço, que é o mesmo nome que está registrado no Eureka.
eureka.instance.instance-id=${spring.application.name}:${random.int}

server.port=0